version: 3
automerge: false
projects:
  - name: dev-vpc
    dir: live/dev/vpc
    workspace: default
    terraform_version: v1.6.6
  - name: dev-app
    dir: live/dev/app
  - name: prod-vpc
    dir: live/prod/vpc
    workflow: terragrunt
workflows:
  terragrunt:
    plan:
      steps:
        - run: terragrunt plan -no-color -out=$PLANFILE
    apply:
      steps:
        - run: terragrunt apply -no-color $PLANFILE
