[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tflens"
version = "0.1.0"
description = "Static, read-only Terraform repository analyzer: resource graph, IAM access, triggers, network and evidence."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Proprietary" }
dependencies = [
    "python-hcl2>=4.3",
    # tflens serve: web UI, WSGI server, encryption of stored secrets
    "flask>=3.0",
    "waitress>=3.0",
    "cryptography>=42",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "ruff>=0.6",
]

[project.scripts]
tflens = "tflens.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
tflens = [
    "static/*.html",
    "static/*.css",
    "static/*.js",
    "static/*.svg",
    "static/vendor/*",
    "static/vendor/aws-icons/*",
    "templates/*.html",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM"]
ignore = ["E501"]
