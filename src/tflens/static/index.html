<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TFLens</title>
  <link rel="icon" type="image/svg+xml" href="/static/favicon.svg">
  <link rel="stylesheet" href="/static/app.css">
</head>
<body>
  <header>
    <a id="home" class="home hidden" href="/runs">&larr; Runs</a>
    <h1>TFLens <span id="title"></span></h1>
    <nav>
      <button type="button" class="tab active" data-view="overview">Overview</button>
      <button type="button" class="tab" data-view="graph">Graph</button>
      <button type="button" class="tab" data-view="diagrams">Diagrams</button>
      <button type="button" class="tab" data-view="repo">Repository</button>
    </nav>
    <a id="changes" class="home hidden" href="changes">Changes</a>
    <div id="summary"></div>
    <button type="button" id="regenerate" title="Re-analyze the repository and rewrite model.json">Regenerate</button>
  </header>
  <div id="failure" class="failure hidden"></div>
  <main>
    <aside id="sidebar">
      <section class="view-overview">
        <h3>Contents</h3>
        <div id="toc"></div>
      </section>
      <section class="view-graph hidden">
        <input type="search" id="search" placeholder="Search name or id" autocomplete="off">
        <label class="inline"><input type="checkbox" id="hide-isolated" checked> Hide unconnected nodes</label>
        <h3>Edge kinds</h3>
        <div id="filter-kinds" class="filters"></div>
        <h3>Services</h3>
        <div id="filter-services" class="filters"></div>
        <h3>Modules</h3>
        <div id="filter-modules" class="filters"></div>
      </section>
      <section class="view-repo hidden">
        <div id="tree"></div>
      </section>
      <section class="view-diagrams hidden">
        <h3>Diagrams</h3>
        <a class="file link" href="#dg-architecture">Architecture</a>
        <a class="file link" href="#dg-module-tree">Module tree</a>
        <a class="file link" href="#dg-env-matrix">Environment matrix</a>
      </section>
    </aside>
    <section id="center">
      <div id="overview" class="view-overview"><p class="muted">Loading the overview…</p></div>
      <div id="graph" class="view-graph hidden"></div>
      <div id="diagrams" class="view-diagrams hidden"><p class="muted">Loading the diagrams…</p></div>
      <div id="file" class="view-repo hidden"><p class="muted">Select a file to list the resources defined in it.</p></div>
    </section>
    <aside id="detail">
      <p class="muted">Click a file:line reference, a node or an edge to see its evidence.</p>
    </aside>
  </main>
  <script src="/static/vendor/cytoscape.min.js"></script>
  <script src="/static/app.js"></script>
</body>
</html>
